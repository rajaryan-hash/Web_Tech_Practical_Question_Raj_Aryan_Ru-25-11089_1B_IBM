<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #e0e0e0; }
        .rev-box { background: #fff; padding: 20px; width: 300px; margin: 0 auto; border-radius: 5px; }
        input { padding: 8px; width: 70%; }
        button { padding: 8px; background: #333; color: #fff; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="rev-box">
    <h3>Reverse Number</h3>
    <input type="text" id="revInput" placeholder="Enter number">
    <button onclick="doReverse()">Go</button>
    <p id="rev-out"></p>
</div>

<script>
    function doReverse() {
        let val = document.getElementById("revInput").value;
        let rev = val.split('').reverse().join('');
        document.getElementById("rev-out").innerText = "Reversed: " + rev;
    }
</script>

</body>
</html>
