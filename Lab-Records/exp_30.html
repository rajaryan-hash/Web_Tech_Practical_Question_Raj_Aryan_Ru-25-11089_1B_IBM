<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .fib-box { padding: 20px; border: 2px solid #333; width: 400px; }
        .fib-num { display: inline-block; padding: 5px; border: 1px solid #ccc; margin: 2px; }
    </style>
</head>
<body>

<div class="fib-box">
    <h3>Fibonacci Sequence (First 10)</h3>
    <button onclick="genFib()">Generate</button>
    <div id="fib-out" style="margin-top:10px;"></div>
</div>

<script>
    function genFib() {
        let n1 = 0, n2 = 1, next;
        let container = document.getElementById("fib-out");
        container.innerHTML = `<span class="fib-num">${n1}</span><span class="fib-num">${n2}</span>`;
        
        for (let i = 2; i < 10; i++) {
            next = n1 + n2;
            container.innerHTML += `<span class="fib-num">${next}</span>`;
            n1 = n2;
            n2 = next;
        }
    }
</script>

</body>
</html>
