<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #0f0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .pattern-box { font-family: monospace; white-space: pre; font-size: 20px; border: 1px dashed #0f0; padding: 20px; }
        button { position: absolute; top: 20px; padding: 10px; background: #0f0; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<button onclick="drawPyramid()">Generate Pattern</button>
<div id="pattern" class="pattern-box"></div>

<script>
    function drawPyramid() {
        let rows = 5;
        let result = "";
        
        for (let i = 1; i <= rows; i++) {
            for (let j = 1; j <= i; j++) {
                result += "* ";
            }
            result += "\n";
        }
        document.getElementById("pattern").innerText = result;
    }
</script>

</body>
</html>
