<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #ffebee; }
        .buzz-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 250px; text-align: center; border-bottom: 4px solid #f44336; }
        input { padding: 8px; width: 80%; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 10px; padding: 8px 16px; background: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="buzz-card">
    <h3>Buzz Number Check</h3>
    <input type="number" id="buzzIn">
    <button onclick="checkBuzz()">Check</button>
    <div id="buzz-res" style="margin-top:15px; font-weight:bold;"></div>
</div>

<script>
    function checkBuzz() {
        let n = parseInt(document.getElementById("buzzIn").value);
        if (n % 7 === 0 || n % 10 === 7) {
            document.getElementById("buzz-res").innerText = "It is a Buzz Number";
        } else {
            document.getElementById("buzz-res").innerText = "Not a Buzz Number";
        }
    }
</script>

</body>
</html>
