<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .digit-check { padding: 20px; border: 1px solid #ccc; background: #fff; width: 250px; text-align: center; border-radius: 8px; }
        input { display: block; width: 90%; margin: 10px auto; padding: 5px; }
        button { padding: 8px 20px; background: #9c27b0; color: white; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<div class="digit-check">
    <h3>Last Digit Checker</h3>
    <input type="number" id="d1" placeholder="Int 1">
    <input type="number" id="d2" placeholder="Int 2">
    <input type="number" id="d3" placeholder="Int 3">
    <button onclick="checkDigits()">Check</button>
    <p id="digit-res" style="font-weight: bold;"></p>
</div>

<script>
    function checkDigits() {
        let x = parseInt(document.getElementById("d1").value);
        let y = parseInt(document.getElementById("d2").value);
        let z = parseInt(document.getElementById("d3").value);
        
        let lastX = x % 10;
        let lastY = y % 10;
        let lastZ = z % 10;
        
        let same = (lastX === lastY && lastY === lastZ);
        document.getElementById("digit-res").innerText = same ? "TRUE (Same digits)" : "FALSE";
    }
</script>

</body>
</html>
