<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #fffde7; }
        .duck-box { background: white; padding: 25px; border: 2px solid #fbc02d; border-radius: 10px; width: 260px; text-align: center; }
        input { padding: 8px; width: 80%; border: 1px solid #fbc02d; }
        button { margin-top: 10px; padding: 8px 16px; background: #fbc02d; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="duck-box">
    <h3>Duck Number Check</h3>
    <input type="text" id="duckIn" placeholder="Enter number">
    <button onclick="checkDuck()">Quack?</button>
    <div id="duck-res" style="margin-top:15px;"></div>
</div>

<script>
    function checkDuck() {
        let str = document.getElementById("duckIn").value;
        // Logic: Must have '0', but not at index 0.
        // Also ensure it's not starting with 0 (like 0123)
        if (str.indexOf('0') > 0) {
            document.getElementById("duck-res").innerText = "It is a Duck Number!";
        } else {
            document.getElementById("duck-res").innerText = "Not a Duck Number";
        }
    }
</script>

</body>
</html>
